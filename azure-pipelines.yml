# Pipeline CI/CD de mini-banco
# Corre en un agente propio (Pool-CI) y usa un registry local en vez de ACR.
# Flujo: Build (construir -> probar -> publicar) -> Desarrollo -> QA -> Produccion
# La imagen se construye UNA sola vez y los ambientes descargan esa misma imagen.
# En un Pull Request solo se construye y prueba: no se publica ni se despliega.

trigger:
- master

pool:
  name: Pool-CI

variables:
  registry: 'localhost:5001'
  imageName: 'mini-banco'
  imageTag: 'sha-$(Build.SourceVersion)'
  image: '$(registry)/$(imageName):$(imageTag)'

stages:

- stage: Build
  displayName: 'Build: construir, probar y publicar'
  jobs:
  - job: BuildAndTest
    displayName: 'Construir y probar'
    workspace:
      clean: all
    steps:
    - checkout: self

    - script: docker build -t $(image) .
      displayName: 'Construir imagen'

    - script: docker run --rm $(image) python3 -m pytest
      displayName: 'Ejecutar tests dentro de la imagen'

    - script: docker push $(image)
      displayName: 'Publicar imagen en el registry local'
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

- stage: Desarrollo
  displayName: 'Desarrollo'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  dependsOn: Build
  jobs:
  - deployment: DeployDesarrollo
    displayName: 'Desplegar en Desarrollo'
    environment: Desarrollo
    strategy:
      runOnce:
        deploy:
          steps:
          - script: docker pull $(image)
            displayName: 'Descargar imagen'
          - script: docker run --rm $(image)
            displayName: 'Ejecutar aplicacion'

- stage: QA
  displayName: 'QA'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  dependsOn: Desarrollo
  jobs:
  - deployment: DeployQA
    displayName: 'Desplegar en QA'
    environment: QA
    strategy:
      runOnce:
        deploy:
          steps:
          - script: docker pull $(image)
            displayName: 'Descargar imagen'
          - script: docker run --rm $(image)
            displayName: 'Ejecutar aplicacion'

- stage: Produccion
  displayName: 'Produccion'
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  dependsOn: QA
  jobs:
  - deployment: DeployProd
    displayName: 'Desplegar en Produccion'
    environment: Produccion
    strategy:
      runOnce:
        deploy:
          steps:
          - script: docker pull $(image)
            displayName: 'Descargar imagen'
          - script: docker run --rm $(image)
            displayName: 'Ejecutar aplicacion'
