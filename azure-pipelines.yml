# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: 'Build'

  jobs:

  - job: BuildAndTest
    displayName: 'Construir y probar'

    steps:

    - task: Docker@2
      displayName: 'Construir imagen Docker'
      inputs:
        command: build
        repository: minibancolab2026.azurecr.io/mini-banco
        Dockerfile: '**/Dockerfile'
        tags: |
          1.0

    - script: docker run --rm minibancolab2026.azurecr.io/mini-banco:1.0 python3 -m pytest
      displayName: 'Ejecutar tests en Docker'

    - task: Docker@2
      displayName: 'Publicar imagen en ACR'
      inputs:
        command: push
        containerRegistry: 'sc-mini-banco-docker'
        repository: mini-banco
        tags: |
          1.0

- stage: QA
  displayName: 'QA'

  jobs:

  - job: TestQA
    displayName: 'Probar aplicación en QA'

    steps:

    - task: Docker@2
      displayName: 'Descargar imagen desde ACR'
      inputs:
        command: pull
        containerRegistry: 'sc-mini-banco-docker'
        repository: mini-banco
        tags: |
          1.0

    - script: docker run --rm minibancolab2026.azurecr.io/mini-banco:1.0
      displayName: 'Ejecutar aplicación en QA'

- stage: Production
  displayName: 'Production'

  jobs:

  - job: DeployProduction
    displayName: 'Desplegar en Production'

    steps:

    - task: Docker@2
      displayName: 'Descargar imagen desde ACR'
      inputs:
        command: pull
        containerRegistry: 'sc-mini-banco-docker'
        repository: mini-banco
        tags: |
          1.0

    - script: docker run --rm minibancolab2026.azurecr.io/mini-banco:1.0
      displayName: 'Ejecutar aplicación en Production'