# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- script: docker build -t mini-banco:1.0 .
  displayName: 'Construir imagen Docker'

- script: docker run --rm mini-banco:1.0 python3 -m pytest
  displayName: 'Ejecutar tests en Docker'

- script: docker run --rm mini-banco:1.0
  displayName: 'Ejecutar aplicación en Docker'

